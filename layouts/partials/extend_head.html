<style>
  /* Active section nav link */
  header.header nav.nav ul#menu a span.active {
    color: var(--accent-text) !important;
  }

  {{- with .Section }}
  /* Keep the section's nav link highlighted on its posts */
  header.header nav.nav ul#menu a[href$="/{{ . }}/"] span {
    color: var(--accent-text) !important;
    font-weight: 500;
    border-bottom: 2px solid currentColor;
  }
  {{- end }}

  /* Body links: LinkedIn, X */
  .about-content a {
    color: var(--accent-text) !important;
    text-decoration: none;
    border-bottom: 1px solid var(--accent-text);
  }

  .about-content a:hover {
    opacity: 0.75;
  }
</style>
